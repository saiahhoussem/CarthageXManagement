
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CarthageKids{% endblock %}</title>

    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'img/logo-icone-carthagekids.png' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    {% block navbar %}
        {% include "navbar.html" %}
    {% endblock %}

    <div class="ck-page">

        {% block sidebar %}
        {% endblock %}

        {% block content %}
        {% endblock %}

    </div>

    {% block extra_js %}{% endblock %}

    <script>
      (function () {
        var bouton = document.getElementById('bouton-menu-mobile');
        var sidebar = document.querySelector('.ck-sidebar');
        if (!bouton || !sidebar) return;

        var fond = document.createElement('div');
        fond.className = 'ck-sidebar-fond';
        document.body.appendChild(fond);

        function fermer() {
          sidebar.classList.remove('ck-sidebar-ouverte');
          fond.classList.remove('visible');
        }
        bouton.addEventListener('click', function () {
          sidebar.classList.toggle('ck-sidebar-ouverte');
          fond.classList.toggle('visible');
        });
        fond.addEventListener('click', fermer);
      })();
    </script>

</body>
</html>
