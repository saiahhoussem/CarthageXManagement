<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer une personne autorisée</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    {% load static %}
    <link
        rel="stylesheet"
        href="{% static 'enfants/fiche_enfant.css' %}"
    >
</head>

<body>

    <div class="container py-5 fiche-enfant">

        <div class="mb-4">
            <h1 class="fw-semibold">
                Supprimer une personne autorisée
            </h1>

            <p class="text-muted">
                Enfant : {{ enfant.nom }}
            </p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">

                <p>
                    Voulez-vous vraiment supprimer la personne
                    <strong>{{ personne.nom }}</strong> ?
                </p>

                <p class="text-muted">
                    Relation : {{ personne.relation }}
                </p>

                <p class="text-muted">
                    Téléphone : {{ personne.telephone }}
                </p>

                <form method="post">
                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Oui, supprimer
                    </button>

                    <a
                        href="{% url 'fiche_enfant' enfant.id %}"
                        class="btn btn-secondary"
                    >
                        Annuler
                    </a>
                </form>

            </div>
        </div>

    </div>

</body>
</html>
