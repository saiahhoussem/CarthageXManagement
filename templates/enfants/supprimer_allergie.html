<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>Supprimer une allergie</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'enfants/fiche_enfant.css' %}"
    >

</head>

<body>

    <div class="container py-5 fiche-enfant">

        <div class="card shadow-sm">

            <div class="card-body">

                <h1 class="h4 mb-4">
                    Supprimer une allergie
                </h1>

                <p>
                    Voulez-vous vraiment supprimer cette allergie ?
                </p>

                <p>
                    <strong>Type :</strong>
                    {{ allergie.type_allergie }}
                </p>

                <p>
                    <strong>Réaction :</strong>
                    {{ allergie.reaction }}
                </p>


                <form method="post" class="mt-4">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Oui, supprimer
                    </button>

                    <a
                        href="{% url 'fiche_enfant' enfant.id %}"
                        class="btn btn-secondary"
                    >
                        Annuler
                    </a>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
