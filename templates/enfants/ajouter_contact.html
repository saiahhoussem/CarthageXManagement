<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>Ajouter un contact d'urgence</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'enfants/fiche_enfant.css' %}"
    >

</head>

<body>

    <div class="container py-5 fiche-enfant">

        <div class="mb-4">

            <h1 class="fw-semibold">
                Ajouter un contact d'urgence
            </h1>

            <p class="text-muted">
                Enfant : {{ enfant.nom }}
            </p>

        </div>


        <div class="card shadow-sm">

            <div class="card-header bg-white">

                <h2 class="h5 mb-0">
                    Informations du contact
                </h2>

            </div>


            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}


                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Enregistrer
                        </button>

                        <a
                            href="{% url 'fiche_enfant' enfant.id %}"
                            class="btn btn-secondary"
                        >
                            Annuler
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
